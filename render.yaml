services:
  - type: web
    name: ca-chatbot
    runtime: image
    plan: free
    image:
      url: ghcr.io/Sanjib8830/ca-chatbot:latest
      creds:
        fromRegistryCreds:
          name: github-container-registry
    healthCheckPath: /
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: PORT
        value: "3001"